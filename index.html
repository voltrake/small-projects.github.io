<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Simple 3D Tube</title>
  <style>
    body{
      margin:0; min-height:100vh;
      display:grid; place-items:center;
      background: radial-gradient(circle at 30% 20%, #223a7a, #070912 60%);
      color:#eaf2ff;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
      overflow:hidden;
      user-select:none;
    }

    .stage{
      width:min(90vw,420px);
      aspect-ratio: 1/1;
      perspective: 800px;
      display:grid;
      place-items:center;
    }

    .tube{
      position:relative;
      width: 320px;
      height: 320px;
      transform-style: preserve-3d;
      filter: drop-shadow(0 18px 25px rgba(0,0,0,.55));
      cursor: grab;
      touch-action:none;
    }
    .tube:active{ cursor: grabbing; }

    .slice{
      position:absolute;
      top:50%; left:50%;
      width: 18px;
      height: 320px;
      transform-style: preserve-3d;
      border-radius: 10px;
      background: linear-gradient(180deg, rgba(255,255,255,.18), rgba(255,255,255,.04));
      border: 1px solid rgba(160,190,255,.18);
      box-shadow: inset 0 0 18px rgba(90,200,255,.15);
      opacity:.95;
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="tube" id="tube" aria-label="Simple 3D tube"></div>
  </div>

  <script>
    const tube = document.getElementById('tube');

    const segments = 16;
    const sliceW = 18;     // must match CSS .slice width
    const tubeH = 320;     // must match CSS .slice height

    // radius so slices wrap around
    const radius = sliceW / (2 * Math.tan(Math.PI / segments));

    // Build tube slices
    for (let i = 0; i < segments; i++){
      const slice = document.createElement('div');
      slice.className = 'slice';
      const angle = (360 / segments) * i;
      slice.style.transform =
        `translate(-50%, -50%) rotateY(${angle}deg) translateZ(${radius}px)`;
      tube.appendChild(slice);
    }

    // Rotate: drag to rotate "willingly"
    let isDown = false;
    let lastX = 0, lastY = 0;

    let rotX = -10;
    let rotY = 20;
    let targetRotX = rotX;
    let targetRotY = rotY;

    function apply(){
      rotX = Math.max(-80, Math.min(80, targetRotX));
      rotY = targetRotY;
      tube.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;
    }

    apply();

    function down(x, y){
      isDown = true;
      lastX = x; lastY = y;
    }

    function move(x, y){
      if(!isDown) return;
      const dx = x - lastX;
      const dy = y - lastY;
      targetRotY += dx * 0.35;
      targetRotX -= dy * 0.25;
      lastX = x; lastY = y;
    }

    function up(){ isDown = false; }

    tube.addEventListener('mousedown', (e)=>down(e.clientX, e.clientY));
    window.addEventListener('mousemove', (e)=>move(e.clientX, e.clientY));
    window.addEventListener('mouseup', up);

    tube.addEventListener('touchstart', (e)=>{
      const t = e.touches[0];
      down(t.clientX, t.clientY);
    }, {passive:true});

    window.addEventListener('touchmove', (e)=>{
      const t = e.touches[0];
      move(t.clientX, t.clientY);
    }, {passive:true});

    window.addEventListener('touchend', up);

    // Gentle auto-rotate when not dragging
    let auto = true;
    window.addEventListener('blur', ()=> auto = false);
    window.addEventListener('focus', ()=> auto = true);

    function animate(){
      if(auto && !isDown) targetRotY += 0.2;
      apply();
      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
