<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="style.css">

  <title>Music Player</title>



  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;

      background: #D1CCDC;

      font-family: Arial, sans-serif;
    }

    /* Main player */
    .music-box {
      width: 600px;
      min-height: 320px;

      display: flex;

      background: #2E3641;

      border-radius: 14px;

      overflow: hidden;

      box-shadow: 0 8px 20px rgba(46, 54, 65, 0.25);
    }

    /* =========================
       LEFT MUSIC LIBRARY
       ========================= */

    .music-library {
      width: 220px;

      padding: 16px;

      background: #171D27;

      color: #D1CCDC;

      display: flex;
      flex-direction: column;
    }

    .library-title {
  margin: 0 0 10px 0;
  font-size: 15px;
  font-weight: 600;
}

/* Search bar */
.search-container {
  margin-bottom: 10px;
}

#searchInput {
  width: 100%;
  padding: 7px 10px;
  border: 1px solid #2E3641;
  border-radius: 8px;
  background: #2E3641;
  color: #D1CCDC;
  font-size: 12px;
  outline: none;
}

#searchInput::placeholder {
  color: #D1CCDC;
  opacity: 0.6;
}

#searchInput:focus {
  border-color: #D1CCDC;
}

/* Add MP3 button */
    .add-button {
      width: 100%;

      padding: 10px;

      border: none;
      border-radius: 8px;

      background: #D1CCDC;
      color: #171D27;

      font-size: 13px;
      font-weight: 600;

      cursor: pointer;

      transition: transform 0.2s ease;
    }

    .add-button:hover {
      transform: scale(1.03);
    }

    /* Song list */
    .song-list {
      margin-top: 15px;

      display: flex;
      flex-direction: column;

      gap: 6px;

      overflow-y: auto;
    }

    .song {
      width: 100%;

      padding: 9px;

      border-radius: 7px;

      color: #D1CCDC;

      font-size: 12px;

      cursor: pointer;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;

      transition: background 0.2s ease;
    }

    .song:hover {
      background: #2E3641;
    }

    .song.active {
      background: #2E3641;
    }


    /* =========================
       RIGHT PLAYER
       ========================= */

    .player {
      flex: 1;

      padding: 20px;

      display: flex;
      align-items: center;
      gap: 14px;
    }

    /* Play button */
    .play-button {
      flex-shrink: 0;

      width: 48px;
      height: 48px;

      border: none;
      border-radius: 50%;

      background: #D1CCDC;
      color: #2E3641;

      font-size: 18px;

      cursor: pointer;

      display: flex;
      align-items: center;
      justify-content: center;

      transition: transform 0.2s ease;
    }

    .play-button:hover {
      transform: scale(1.08);
    }

    /* Music information */
    .music-info {
      flex: 1;

      min-width: 0;

      display: flex;
      flex-direction: column;
      gap: 4px;

      color: #D1CCDC;
    }

    .music-info span {
      font-size: 15px;
      font-weight: 600;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .music-info small {
      font-size: 11px;

      opacity: 0.7;
    }

    /* Volume */
    .volume {
      width: 55%;

      display: flex;
      align-items: center;

      margin-top: 5px;
    }

    #volume {
      width: 100%;

      height: 3px;

      appearance: none;
      -webkit-appearance: none;

      background: #D1CCDC;

      border-radius: 10px;

      cursor: pointer;
    }

    /* Volume slider */
    #volume::-webkit-slider-thumb {
      appearance: none;
      -webkit-appearance: none;

      width: 11px;
      height: 11px;

      background: #D1CCDC;

      border: 2px solid #2E3641;
      border-radius: 50%;

      cursor: pointer;
    }

    #volume::-moz-range-thumb {
      width: 11px;
      height: 11px;

      background: #D1CCDC;

      border: 2px solid #2E3641;
      border-radius: 50%;

      cursor: pointer;
    }

    /* Hidden file input */
    #fileInput {
      display: none;
    }


    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 650px) {
      .music-box {
        width: 95%;
      }

      .music-library {
        width: 170px;
      }
    }

    @media (max-width: 480px) {
      .music-box {
        flex-direction: column;
      }

      .music-library {
        width: 100%;
      }

      .player {
        width: 100%;
      }
    }
  </style>

</head>

<body>

  <div class="music-box">

<!-- =====================
     LEFT MUSIC LIBRARY
     ===================== -->

<aside class="music-library">

  <h3 class="library-title">My Music</h3>

<div class="search-container">
  <input
    type="search"
    id="searchInput"
    placeholder="Search music..."
    autocomplete="off"
  >
</div>

<button id="addButton" class="add-button">
  + Add MP3
</button>

<input
  type="file"
  id="fileInput"
  accept=".mp3,audio/mpeg"
>

  <div class="song-list" id="songList">
    <!-- Songs will appear here -->
  </div>

</aside>


<!-- =====================
     RIGHT PLAYER
     ===================== -->

<main class="player">

  <button id="playButton" class="play-button">
    ▶
  </button>

 
<div class="music-info">

  <!-- Song title -->
  <span id="songTitle">
    No song selected
  </span>

  <!-- Player subtitle -->
  <small>
    Music Player
  </small>


  <!-- Progress bar -->
  <div class="progress-container">

    <span id="currentTime">
      0:00
    </span>

    <input
      id="progress"
      type="range"
      min="0"
      max="100"
      value="0"
      step="0.1"
    >

    <span id="duration">
      0:00
    </span>

  </div>


  <!-- Volume -->
  <div class="volume">

    <input
      id="volume"
      type="range"
      min="0"
      max="1"
      step="0.01"
      value="0.7"
    >

  </div>

</div>



</main>

  </div>

<!-- Song action menu -->
<div id="songContextMenu" class="song-context-menu">
  <button id="favoriteSong">☆ Add to Favorites</button>
  <button id="shareSong">↗ Share</button>
  <button id="deleteSong" class="delete-song">Delete</button>
</div>

  <!-- Audio element -->

<audio id="audio"></audio>

<script>
  <script>

  /* =========================
     ELEMENTS
     ========================= */

  const button = document.getElementById("playButton");
  const audio = document.getElementById("audio");

  const addButton = document.getElementById("addButton");
  const fileInput = document.getElementById("fileInput");

  const volume = document.getElementById("volume");

  const songList = document.getElementById("songList");
  const songTitle = document.getElementById("songTitle");
  const searchInput = document.getElementById("searchInput");

  const progress = document.getElementById("progress");
  const currentTime = document.getElementById("currentTime");
  const duration = document.getElementById("duration");

  /* Song action menu */

  const menu =
    document.getElementById("songContextMenu");

  const favoriteBtn =
    document.getElementById("favoriteSong");

  const shareBtn =
    document.getElementById("shareSong");

  const deleteBtn =
    document.getElementById("deleteSong");


  /* =========================
     VARIABLES
     ========================= */

  let songs = [];

  let currentSong = null;

  let currentSongId = null;

  let currentObjectUrl = null;

  let menuSongId = null;

  let db = null;


  /* =========================
     INDEXED DB
     ========================= */

  const dbReady = new Promise((resolve, reject) => {

    const request =
      indexedDB.open("MusicPlayerDB", 2);


    /* DATABASE UPGRADE */

    request.onupgradeneeded = (event) => {

      db = event.target.result;


      /* Songs */

      if (
        !db.objectStoreNames.contains("songs")
      ) {

        db.createObjectStore("songs", {
          keyPath: "id",
          autoIncrement: true
        });

      }


      /* Favorites */

      if (
        !db.objectStoreNames.contains("favorites")
      ) {

        db.createObjectStore("favorites", {
          keyPath: "songId"
        });

      }

    };


    /* DATABASE READY */

    request.onsuccess = async () => {

      db = request.result;

      try {

        await loadSongsFromDB();

        resolve();

      } catch (error) {

        console.error(
          "Could not load songs:",
          error
        );

        resolve();

      }

    };


    /* DATABASE ERROR */

    request.onerror = () => {

      console.error(
        "Database error:",
        request.error
      );

      reject(request.error);

    };

  });


  /* =========================
     SAVE SONG
     ========================= */

  function saveSongToDB(file) {

    return new Promise((resolve, reject) => {

      const transaction =
        db.transaction(
          ["songs"],
          "readwrite"
        );

      const store =
        transaction.objectStore("songs");


      const request = store.add({

        name: file.name,

        type:
          file.type || "audio/mpeg",

        file: file,

        addedAt: Date.now()

      });


      request.onsuccess = () => {

        resolve(request.result);

      };


      request.onerror = () => {

        reject(request.error);

      };

    });

  }


  /* =========================
     LOAD SONGS
     ========================= */

  async function loadSongsFromDB() {

    const transaction =
      db.transaction(
        ["songs", "favorites"],
        "readonly"
      );


    const songRequest =
      transaction
        .objectStore("songs")
        .getAll();


    const favoriteRequest =
      transaction
        .objectStore("favorites")
        .getAllKeys();


    return new Promise((resolve, reject) => {

      transaction.oncomplete = () => {

        const favoriteIds =
          new Set(
            favoriteRequest.result
          );


        songs =
          songRequest.result.map(song => ({

            id: song.id,

            name: song.name,

            type:
              song.type || "audio/mpeg",

            file: song.file,

            favorite:
              favoriteIds.has(song.id)

          }));


        displaySongs();

        resolve();

      };


      transaction.onerror = () => {

        reject(transaction.error);

      };

    });

  }


  /* =========================
     PLAY / PAUSE
     ========================= */

  button.addEventListener(
    "click",
    async () => {

      if (!currentSong) {

        return;

      }


      if (audio.paused) {

        try {

          await audio.play();

          button.textContent = "❚❚";

        } catch (error) {

          console.error(
            "Could not play audio:",
            error
          );

        }

      } else {

        audio.pause();

        button.textContent = "▶";

      }

    }
  );


  /* =========================
     MUSIC ENDED
     ========================= */

  audio.addEventListener(
    "ended",
    () => {

      button.textContent = "▶";

      progress.value = 0;

    }
  );


  /* =========================
     VOLUME
     ========================= */

  volume.addEventListener(
    "input",
    () => {

      audio.volume =
        Number(volume.value);

    }
  );


  audio.volume = 0.7;


  /* =========================
     ADD MP3 BUTTON
     ========================= */

  addButton.addEventListener(
    "click",
    async () => {

      await dbReady;

      fileInput.click();

    }
  );


  /* =========================
     FILE SELECTED
     ========================= */

  fileInput.addEventListener(
    "change",
    async (event) => {

      await dbReady;


      const files =
        Array.from(
          event.target.files
        );


      for (const file of files) {


        /* Only MP3 */

        if (
          file.type !== "audio/mpeg" &&
          !file.name
            .toLowerCase()
            .endsWith(".mp3")
        ) {

          continue;

        }


        try {

          /* Save permanently */

          const id =
            await saveSongToDB(file);


          /* Add to memory */

          songs.push({

            id: id,

            name: file.name,

            type:
              file.type || "audio/mpeg",

            file: file,

            favorite: false

          });


        } catch (error) {

          console.error(
            "Could not save song:",
            error
          );

        }

      }


      /* Refresh list */

      displaySongs();


      /* Allow selecting same file again */

      fileInput.value = "";

    }
  );


  /* =========================
     SEARCH
     ========================= */

  searchInput.addEventListener(
    "input",
    displaySongs
  );


  /* =========================
     DISPLAY SONGS
     ========================= */

  function displaySongs() {

    songList.innerHTML = "";


    const searchTerm =
      searchInput.value
        .trim()
        .toLowerCase();


    songs.forEach(
      (song, index) => {


        /* Search filter */

        if (
          searchTerm &&
          !song.name
            .toLowerCase()
            .includes(searchTerm)
        ) {

          return;

        }


        const songElement =
          document.createElement("div");


        songElement.classList.add(
          "song"
        );


        /* Active song */

        if (
          song.id === currentSongId
        ) {

          songElement.classList.add(
            "active"
          );

        }


        /* Favorite star */

        songElement.textContent =
          (song.favorite
            ? "★ "
            : "") +
          song.name;


        /* LEFT CLICK */

        songElement.addEventListener(
          "click",
          () => {

            selectSong(index);


            showSongMenu(

              song.id,

              songElement
                .getBoundingClientRect()
                .left,

              songElement
                .getBoundingClientRect()
                .bottom + 4

            );

          }
        );


        songList.appendChild(
          songElement
        );

      }
    );

  }


  /* =========================
     SELECT SONG
     ========================= */

  function selectSong(index) {

    const song =
      songs[index];


    if (!song) {

      return;

    }


    currentSong =
      song.file;


    currentSongId =
      song.id;


    /* Remove old URL */

    if (currentObjectUrl) {

      URL.revokeObjectURL(
        currentObjectUrl
      );

    }


    /* Create audio URL */

    currentObjectUrl =
      URL.createObjectURL(
        song.file
      );


    audio.src =
      currentObjectUrl;


    songTitle.textContent =
      song.name;


    button.textContent =
      "▶";


    progress.value = 0;

    currentTime.textContent =
      "0:00";

    duration.textContent =
      "0:00";


    displaySongs();


    /* Start playing */

    audio.play()
      .then(() => {

        button.textContent =
          "❚❚";

      })
      .catch(error => {

        console.error(
          "Could not play audio:",
          error
        );

      });

  }


  /* =========================
     SONG MENU
     ========================= */

  function showSongMenu(
    songId,
    x,
    y
  ) {

    const song =
      songs.find(
        item =>
          item.id === songId
      );


    if (!song) {

      return;

    }


    menuSongId =
      songId;


    /* Favorite button text */

    favoriteBtn.textContent =
      song.favorite

        ? "★ Remove from Favorites"

        : "☆ Add to Favorites";


    menu.style.display =
      "block";


    const width = 175;

    const height = 125;


    menu.style.left =
      Math.max(
        8,
        Math.min(
          x,
          window.innerWidth -
            width -
            8
        )
      ) + "px";


    menu.style.top =
      Math.max(
        8,
        Math.min(
          y,
          window.innerHeight -
            height -
            8
        )
      ) + "px";

  }


  /* =========================
     HIDE MENU
     ========================= */

  function hideSongMenu() {

    menu.style.display =
      "none";

    menuSongId = null;

  }


  /* =========================
     FAVORITES
     ========================= */

  favoriteBtn.addEventListener(
    "click",
    () => {

      const song =
        songs.find(
          item =>
            item.id === menuSongId
        );


      if (!song) {

        hideSongMenu();

        return;

      }


      song.favorite =
        !song.favorite;


      const transaction =
        db.transaction(
          "favorites",
          "readwrite"
        );


      const store =
        transaction
          .objectStore(
            "favorites"
          );


      if (song.favorite) {

        store.put({

          songId: song.id

        });

      } else {

        store.delete(
          song.id
        );

      }


      transaction.oncomplete =
        () => {

          displaySongs();

          hideSongMenu();

        };

    }
  );


  /* =========================
     DELETE
     ========================= */

  deleteBtn.addEventListener(
    "click",
    () => {

      const song =
        songs.find(
          item =>
            item.id === menuSongId
        );


      if (!song) {

        hideSongMenu();

        return;

      }


      const confirmed =
        confirm(
          `Delete "${song.name}" from your music library?`
        );


      if (!confirmed) {

        hideSongMenu();

        return;

      }


      const transaction =
        db.transaction(
          [
            "songs",
            "favorites"
          ],
          "readwrite"
        );


      transaction
        .objectStore("songs")
        .delete(song.id);


      transaction
        .objectStore("favorites")
        .delete(song.id);


      transaction.oncomplete =
        () => {


          /* If currently playing */

          if (
            song.id ===
            currentSongId
          ) {

            audio.pause();

            audio.removeAttribute(
              "src"
            );

            audio.load();


            if (currentObjectUrl) {

              URL.revokeObjectURL(
                currentObjectUrl
              );

              currentObjectUrl =
                null;

            }


            currentSong =
              null;

            currentSongId =
              null;


            songTitle.textContent =
              "No song selected";


            button.textContent =
              "▶";


            progress.value =
              0;

            currentTime.textContent =
              "0:00";

            duration.textContent =
              "0:00";

          }


          /* Remove from array */

          songs =
            songs.filter(
              item =>
                item.id !== song.id
            );


          displaySongs();

          hideSongMenu();

        };

    }
  );


  /* =========================
     SHARE
     ========================= */

  shareBtn.addEventListener(
    "click",
    async () => {

      const song =
        songs.find(
          item =>
            item.id === menuSongId
        );


      if (!song) {

        hideSongMenu();

        return;

      }


      try {

        const shareFile =
          new File(

            [song.file],

            song.name,

            {
              type:
                song.type ||
                "audio/mpeg"
            }

          );


        /* Share actual MP3 */

        if (
          navigator.share &&
          navigator.canShare &&
          navigator.canShare({
            files: [shareFile]
          })
        ) {

          await navigator.share({

            title:
              song.name,

            text:
              "Music",

            files:
              [shareFile]

          });


        } else {

          alert(
            "File sharing is not supported by this browser."
          );

        }


      } catch (error) {


        /* User cancelled share */

        if (
          error.name !==
          "AbortError"
        ) {

          console.error(
            "Could not share song:",
            error
          );

        }

      }


      hideSongMenu();

    }
  );


  /* =========================
     CLOSE MENU
     ========================= */

  document.addEventListener(
    "click",
    (event) => {

      if (
        menu.style.display ===
        "block" &&

        !menu.contains(
          event.target
        ) &&

        !event.target.closest(
          ".song"
        )
      ) {

        hideSongMenu();

      }

    }
  );


  /* =========================
     WINDOW RESIZE
     ========================= */

  window.addEventListener(
    "resize",
    hideSongMenu
  );


  /* =========================
     PROGRESS
     ========================= */

  audio.addEventListener(
    "timeupdate",
    () => {

      if (!audio.duration) {

        return;

      }


      progress.value =
        (
          audio.currentTime /
          audio.duration
        ) * 100;


      currentTime.textContent =
        formatTime(
          audio.currentTime
        );

    }
  );


  /* =========================
     DURATION
     ========================= */

  audio.addEventListener(
    "loadedmetadata",
    () => {

      duration.textContent =
        formatTime(
          audio.duration
        );

    }
  );


  /* =========================
     SEEK
     ========================= */

  progress.addEventListener(
    "input",
    () => {

      if (!audio.duration) {

        return;

      }


      audio.currentTime =
        (
          progress.value /
          100
        ) *
        audio.duration;

    }
  );


  /* =========================
     FORMAT TIME
     ========================= */

  function formatTime(seconds) {

    if (isNaN(seconds)) {

      return "0:00";

    }


    const minutes =
      Math.floor(
        seconds / 60
      );


    const remainingSeconds =
      Math.floor(
        seconds % 60
      );


    return (
      minutes +
      ":" +
      remainingSeconds
        .toString()
        .padStart(2, "0")
    );

  }


  /* =========================
     CLEANUP
     ========================= */

  window.addEventListener(
    "beforeunload",
    () => {

      if (currentObjectUrl) {

        URL.revokeObjectURL(
          currentObjectUrl
        );

      }

    }
  );

</script>
</script>

</body>
</html>
