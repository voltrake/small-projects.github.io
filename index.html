<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Music Player</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;

      background: #D1CCDC;

      font-family: Arial, sans-serif;
    }

    /* Main player */
    .music-box {
      width: 600px;
      min-height: 320px;

      display: flex;

      background: #2E3641;

      border-radius: 14px;

      overflow: hidden;

      box-shadow: 0 8px 20px rgba(46, 54, 65, 0.25);
    }

    /* =========================
       LEFT MUSIC LIBRARY
       ========================= */

    .music-library {
      width: 220px;

      padding: 16px;

      background: #171D27;

      color: #D1CCDC;

      display: flex;
      flex-direction: column;
    }

    .library-title {
      margin: 0 0 14px 0;

      font-size: 15px;
      font-weight: 600;
    }

    /* Add MP3 button */
    .add-button {
      width: 100%;

      padding: 10px;

      border: none;
      border-radius: 8px;

      background: #D1CCDC;
      color: #171D27;

      font-size: 13px;
      font-weight: 600;

      cursor: pointer;

      transition: transform 0.2s ease;
    }

    .add-button:hover {
      transform: scale(1.03);
    }

    /* Song list */
    .song-list {
      margin-top: 15px;

      display: flex;
      flex-direction: column;

      gap: 6px;

      overflow-y: auto;
    }

    .song {
      width: 100%;

      padding: 9px;

      border-radius: 7px;

      color: #D1CCDC;

      font-size: 12px;

      cursor: pointer;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;

      transition: background 0.2s ease;
    }

    .song:hover {
      background: #2E3641;
    }

    .song.active {
      background: #2E3641;
    }


    /* =========================
       RIGHT PLAYER
       ========================= */

    .player {
      flex: 1;

      padding: 20px;

      display: flex;
      align-items: center;
      gap: 14px;
    }

    /* Play button */
    .play-button {
      flex-shrink: 0;

      width: 48px;
      height: 48px;

      border: none;
      border-radius: 50%;

      background: #D1CCDC;
      color: #2E3641;

      font-size: 18px;

      cursor: pointer;

      display: flex;
      align-items: center;
      justify-content: center;

      transition: transform 0.2s ease;
    }

    .play-button:hover {
      transform: scale(1.08);
    }

    /* Music information */
    .music-info {
      flex: 1;

      min-width: 0;

      display: flex;
      flex-direction: column;
      gap: 4px;

      color: #D1CCDC;
    }

    .music-info span {
      font-size: 15px;
      font-weight: 600;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .music-info small {
      font-size: 11px;

      opacity: 0.7;
    }

    /* Volume */
    .volume {
      width: 100%;

      display: flex;
      align-items: center;

      margin-top: 5px;
    }

    #volume {
      width: 100%;

      height: 4px;

      appearance: none;
      -webkit-appearance: none;

      background: #D1CCDC;

      border-radius: 10px;

      cursor: pointer;
    }

    /* Volume slider */
    #volume::-webkit-slider-thumb {
      appearance: none;
      -webkit-appearance: none;

      width: 11px;
      height: 11px;

      background: #D1CCDC;

      border: 2px solid #2E3641;
      border-radius: 50%;

      cursor: pointer;
    }

    #volume::-moz-range-thumb {
      width: 11px;
      height: 11px;

      background: #D1CCDC;

      border: 2px solid #2E3641;
      border-radius: 50%;

      cursor: pointer;
    }

    /* Hidden file input */
    #fileInput {
      display: none;
    }


    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 650px) {
      .music-box {
        width: 95%;
      }

      .music-library {
        width: 170px;
      }
    }

    @media (max-width: 480px) {
      .music-box {
        flex-direction: column;
      }

      .music-library {
        width: 100%;
      }

      .player {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <div class="music-box">

    <!-- =====================
         LEFT MUSIC LIBRARY
         ===================== -->

    <aside class="music-library">

      <h3 class="library-title">My Music</h3>

      <button class="add-button" id="addButton">
        + Add MP3
      </button>

      <input
        type="file"
        id="fileInput"
        accept="audio/mpeg,.mp3"
        multiple
      >

      <div class="song-list" id="songList">
        <!-- Songs will appear here -->
      </div>

    </aside>


    <!-- =====================
         RIGHT PLAYER
         ===================== -->

    <main class="player">

      <button id="playButton" class="play-button">
        ▶
      </button>

      <div class="music-info">

        <span id="songTitle">
          No song selected
        </span>

        <small>
          Music Player
        </small>


<div class="volume">

  <input
    id="volume"
    type="range"
    min="0"
    max="1"
    step="0.01"
    value="0.7"
  >

</div>

<!-- Music progress / seek bar -->

<div class="progress-container">

  <span id="currentTime">0:00</span>

  <input
    id="progress"
    type="range"
    min="0"
    max="100"
    value="0"
    step="0.1"
  >

  <span id="duration">0:00</span>

</div>

      </div>

    </main>

  </div>


  

  <!-- Audio element -->

  <audio id="audio"></audio>


  ```html
<script>

  const button = document.getElementById("playButton");
  const audio = document.getElementById("audio");
  const volume = document.getElementById("volume");

  const addButton = document.getElementById("addButton");
  const fileInput = document.getElementById("fileInput");

  const songList = document.getElementById("songList");
  const songTitle = document.getElementById("songTitle");

  const progress = document.getElementById("progress");
  const currentTime = document.getElementById("currentTime");
  const duration = document.getElementById("duration");


  /* =========================
     VARIABLES
     ========================= */

  let songs = [];
  let currentSong = null;


  /* =========================
     PLAY / PAUSE
     ========================= */

  button.addEventListener("click", async () => {

    if (!currentSong) {
      return;
    }

    if (audio.paused) {

      try {

        await audio.play();

        button.textContent = "❚❚";

      } catch (error) {

        console.error("Could not play audio:", error);

      }

    } else {

      audio.pause();

      button.textContent = "▶";

    }

  });


  /* =========================
     MUSIC ENDED
     ========================= */

  audio.addEventListener("ended", () => {

    button.textContent = "▶";
    progress.value = 0;

  });


  /* =========================
     VOLUME
     ========================= */

  volume.addEventListener("input", () => {

    audio.volume = volume.value;

  });

  audio.volume = 0.7;


  /* =========================
     ADD MP3 BUTTON
     ========================= */

  addButton.addEventListener("click", () => {

    fileInput.click();

  });


  /* =========================
     FILE SELECTED
     ========================= */

  fileInput.addEventListener("change", (event) => {

    const files = Array.from(event.target.files);

    files.forEach(file => {

      if (
        file.type !== "audio/mpeg" &&
        !file.name.toLowerCase().endsWith(".mp3")
      ) {
        return;
      }

      songs.push(file);

    });

    displaySongs();

    /* Allow selecting the same file again */
    fileInput.value = "";

  });


  /* =========================
     DISPLAY SONGS
     ========================= */

  function displaySongs() {

    songList.innerHTML = "";

    songs.forEach((song, index) => {

      const songElement = document.createElement("div");

      songElement.classList.add("song");

      if (song === currentSong) {
        songElement.classList.add("active");
      }

      songElement.textContent = song.name;

      songElement.addEventListener("click", () => {

        selectSong(index);

      });

      songList.appendChild(songElement);

    });

  }


  /* =========================
     SELECT SONG
     ========================= */

  function selectSong(index) {

    const song = songs[index];

    if (!song) {
      return;
    }

    currentSong = song;

    const url = URL.createObjectURL(song);

    audio.src = url;

    songTitle.textContent = song.name;

    button.textContent = "▶";

    progress.value = 0;

    currentTime.textContent = "0:00";
    duration.textContent = "0:00";

    displaySongs();

    audio.play()
      .then(() => {

        button.textContent = "❚❚";

      })
      .catch(error => {

        console.error("Could not play audio:", error);

      });

  }


  /* =========================
     UPDATE PROGRESS BAR
     ========================= */

  audio.addEventListener("timeupdate", () => {

    if (!audio.duration) {
      return;
    }

    const percentage =
      (audio.currentTime / audio.duration) * 100;

    progress.value = percentage;

    currentTime.textContent =
      formatTime(audio.currentTime);

  });


  /* =========================
     LOAD SONG DURATION
     ========================= */

  audio.addEventListener("loadedmetadata", () => {

    duration.textContent =
      formatTime(audio.duration);

  });


  /* =========================
     SEEK THROUGH SONG
     ========================= */

  progress.addEventListener("input", () => {

    if (!audio.duration) {
      return;
    }

    const time =
      (progress.value / 100) * audio.duration;

    audio.currentTime = time;

  });


  /* =========================
     FORMAT TIME
     ========================= */

  function formatTime(seconds) {

    if (isNaN(seconds)) {
      return "0:00";
    }

    const minutes =
      Math.floor(seconds / 60);

    const remainingSeconds =
      Math.floor(seconds % 60);

    return (
      minutes +
      ":" +
      remainingSeconds.toString().padStart(2, "0")
    );

  }

</script>

</body>
</html>
