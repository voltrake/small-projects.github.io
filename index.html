<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Simple 3D Donut (CSS 3D)</title>
  <style>
    :root{
      --stage: min(92vw, 520px);
      --tubeW: 34px;      /* thickness of the donut band */
      --segments: 60;     /* more = smoother donut */
      --minorSeg: 18;     /* "height" slices around the band cross-section */
      --bigR: 170px;      /* major radius (center loop) */
      --tilt: -12deg;
    }

    body{
      margin:0; min-height:100vh;
      display:grid; place-items:center;
      background:
        radial-gradient(circle at 25% 20%, #1c3f8a, transparent 55%),
        radial-gradient(circle at 75% 75%, #6b2aa6, transparent 55%),
        #070912;
      overflow:hidden;
      user-select:none;
      color:#eaf2ff;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
    }

    .stage{
      width: var(--stage);
      aspect-ratio: 1/1;
      perspective: 900px;
      display:grid;
      place-items:center;
    }

    .donut{
      position:relative;
      width: calc(var(--bigR) * 2 + 160px);
      height: calc(var(--bigR) * 2 + 160px);
      transform-style: preserve-3d;
      filter: drop-shadow(0 18px 35px rgba(0,0,0,.6));
      cursor: grab;
      touch-action:none;
    }
    .donut:active{ cursor: grabbing; }

    /* Each segment is a thin vertical quad positioned around a circle (major radius).
       We shade via gradients and rotate it to fake a 3D donut look. */
    .seg{
      position:absolute;
      left:50%; top:50%;
      width: calc(var(--tubeW) * 0.95);
      height: 260px; /* band cross-section height (gives depth) */
      transform-style: preserve-3d;
      transform-origin: center center;
      border-radius: 12px;
      background:
        linear-gradient(90deg,
          rgba(255,255,255,.28),
          rgba(120,210,255,.14) 35%,
          rgba(180,90,255,.18) 70%,
          rgba(255,255,255,.10));
      border: 1px solid rgba(160,190,255,.18);
      opacity: .95;
      box-shadow: inset 0 0 30px rgba(80,200,255,.15);
      backdrop-filter: blur(2px);
    }

    /* subtle animated gloss */
    .seg::after{
      content:"";
      position:absolute;
      inset:-30%;
      background: conic-gradient(from 180deg,
        rgba(80,200,255,0) 0deg,
        rgba(80,200,255,.18) 80deg,
        rgba(180,90,255,.22) 140deg,
        rgba(80,200,255,0) 240deg);
      filter: blur(6px);
      opacity:.55;
      animation: gloss 2.7s ease-in-out infinite;
    }
    @keyframes gloss{
      0%,100% { transform: rotate(0deg); }
      50%     { transform: rotate(35deg); }
    }

    .label{
      position:fixed;
      bottom:16px;
      left:50%;
      transform:translateX(-50%);
      font-size:12px;
      letter-spacing:.08em;
      text-transform:uppercase;
      color: rgba(220,235,255,.75);
      padding:10px 12px;
      border-radius: 12px;
      border: 1px solid rgba(160,190,255,.16);
      background: rgba(10,15,35,.25);
      backdrop-filter: blur(8px);
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="donut" id="donut" aria-label="3D donut">
      <!-- segments injected by JS -->
    </div>
  </div>
  <div class="label">Drag to rotate</div>

  <script>
    const donut = document.getElementById('donut');

    const rootStyles = getComputedStyle(document.documentElement);
    const segments = parseInt(rootStyles.getPropertyValue('--segments'), 10) || 60;
    const minorSeg = parseInt(rootStyles.getPropertyValue('--minorSeg'), 10) || 18; // used for cross-section "roundness"
    const bigR = parseFloat(rootStyles.getPropertyValue('--bigR')) || 170;

    // Create segments around the major circle.
    // Each segment will also "bulge" a bit (minorSeg illusion) by changing its tilt and size.
    const segs = [];
    for (let i = 0; i < segments; i++){
      const el = document.createElement('div');
      el.className = 'seg';

      const t = i / segments;               // 0..1 around
      const ang = t * Math.PI * 2;

      // "Minor radius" illusion: use sin to vary vertical offset/scale so it looks donut-like.
      // This isn't a mathematically perfect torus mesh, but it's a simple 3D donut effect using CSS 3D.
      const minor = Math.sin(ang) * 42;    // vertical lift variation

      // Vary scale slightly for a more rounded look
      const s = 0.78 + (Math.cos(ang) * 0.22 + 0.22); // keep positive
      el.style.width = (parseFloat(rootStyles.getPropertyValue('--tubeW')) * 0.95 * s) + 'px';
      el.style.height = (260 * (0.85 + (s-0.78))) + 'px';

      // Place around major circle and angle to face outward-ish
      // We also nudge Y position by minor to fake the torus cross-section.
      const x = Math.cos(ang) * bigR;
      const z = Math.sin(ang) * bigR;

      el.style.transform =
        `translate3d(-50%, -50%, 0)
         translate3d(${x}px, ${minor}px, ${z}px)
         rotateY(${(t*360) % 360}deg)
         rotateX(90deg)`;

      // Opacity depth cue
      const depth = (z / bigR + 1) / 2; // 0..1
      el.style.opacity = 0.65 + depth * 0.35;

      donut.appendChild(el);
      segs.push(el);
    }

    // Drag to rotate "willingly"
    let isDown = false;
    let lastX = 0, lastY = 0;

    let rotX = -12;
    let rotY = 20;
    let targetX = rotX, targetY = rotY;

    function apply(){
      rotX = Math.max(-80, Math.min(80, targetX));
      rotY = targetY;
      // Add a small fixed tilt for a nice view
      donut.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;
    }

    apply();

    function down(x,y){ isDown = true; lastX = x; lastY = y; }
    function move(x,y){
      if(!isDown) return;
      const dx = x - lastX;
      const dy = y - lastY;

      targetY += dx * 0.35;
      targetX -= dy * 0.25;

      lastX = x; lastY = y;
    }
    function up(){ isDown = false; }

    donut.addEventListener('mousedown', e => down(e.clientX, e.clientY));
    window.addEventListener('mousemove', e => move(e.clientX, e.clientY));
    window.addEventListener('mouseup', up);

    donut.addEventListener('touchstart', e => {
      const t = e.touches[0];
      down(t.clientX, t.clientY);
    }, {passive:true});
    window.addEventListener('touchmove', e => {
      const t = e.touches[0];
      move(t.clientX, t.clientY);
    }, {passive:true});
    window.addEventListener('touchend', up);

    // Auto spin
    let auto = true;
    window.addEventListener('blur', () => auto = false);
    window.addEventListener('focus', () => auto = true);

    function animate(){
      if(auto && !isDown) targetY += 0.25;
      apply();
      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
