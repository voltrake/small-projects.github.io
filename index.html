<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Music Player</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;

      background: #D1CCDC;

      font-family: Arial, sans-serif;
    }

    /* Main player */
    .music-box {
      width: 600px;
      min-height: 320px;

      display: flex;

      background: #2E3641;

      border-radius: 14px;

      overflow: hidden;

      box-shadow: 0 8px 20px rgba(46, 54, 65, 0.25);
    }

    /* =========================
       LEFT MUSIC LIBRARY
       ========================= */

    .music-library {
      width: 220px;

      padding: 16px;

      background: #171D27;

      color: #D1CCDC;

      display: flex;
      flex-direction: column;
    }

    .library-title {
  margin: 0 0 10px 0;
  font-size: 15px;
  font-weight: 600;
}

/* Search bar */
.search-container {
  margin-bottom: 10px;
}

#searchInput {
  width: 100%;
  padding: 7px 10px;
  border: 1px solid #2E3641;
  border-radius: 8px;
  background: #2E3641;
  color: #D1CCDC;
  font-size: 12px;
  outline: none;
}

#searchInput::placeholder {
  color: #D1CCDC;
  opacity: 0.6;
}

#searchInput:focus {
  border-color: #D1CCDC;
}

/* Add MP3 button */
    .add-button {
      width: 100%;

      padding: 10px;

      border: none;
      border-radius: 8px;

      background: #D1CCDC;
      color: #171D27;

      font-size: 13px;
      font-weight: 600;

      cursor: pointer;

      transition: transform 0.2s ease;
    }

    .add-button:hover {
      transform: scale(1.03);
    }

    /* Song list */
    .song-list {
      margin-top: 15px;

      display: flex;
      flex-direction: column;

      gap: 6px;

      overflow-y: auto;
    }

    .song {
      width: 100%;

      padding: 9px;

      border-radius: 7px;

      color: #D1CCDC;

      font-size: 12px;

      cursor: pointer;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;

      transition: background 0.2s ease;
    }

    .song:hover {
      background: #2E3641;
    }

    .song.active {
      background: #2E3641;
    }



<!-- =====================
     RIGHT PLAYER
     ===================== -->

<main class="player">

  <button id="playButton" class="play-button">
    ▶
  </button>

  <div class="music-info">

    <!-- Song title + spectrum -->
    <div class="song-title-row">

      <span id="songTitle">
        No song selected
      </span>

      <canvas id="spectrum"></canvas>

    </div>


    <small>
      Music Player
    </small>


    <!-- Volume -->
    <div class="volume">

      <input
        id="volume"
        type="range"
        min="0"
        max="1"
        step="0.01"
        value="0.7"
      >

    </div>


    <!-- Progress -->
    <div class="progress-container">

      <span id="currentTime">
        0:00
      </span>

      <input
        id="progress"
        type="range"
        min="0"
        max="100"
        value="0"
        step="0.1"
      >

      <span id="duration">
        0:00
      </span>

    </div>

  </div>

</main>


    /* Play button */
    .play-button {
      flex-shrink: 0;

      width: 48px;
      height: 48px;

      border: none;
      border-radius: 50%;

      background: #D1CCDC;
      color: #2E3641;

      font-size: 18px;

      cursor: pointer;

      display: flex;
      align-items: center;
      justify-content: center;

      transition: transform 0.2s ease;
    }

    .play-button:hover {
      transform: scale(1.08);
    }

    /* Music information */
    .music-info {
      flex: 1;

      min-width: 0;

      display: flex;
      flex-direction: column;
      gap: 4px;

      color: #D1CCDC;
    }

    .music-info span {
      font-size: 15px;
      font-weight: 600;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .music-info small {
      font-size: 11px;

      opacity: 0.7;
    }

    /* Volume */
    .volume {
      width: 100%;

      display: flex;
      align-items: center;

      margin-top: 5px;
    }

    #volume {
      width: 100%;

      height: 4px;

      appearance: none;
      -webkit-appearance: none;

      background: #D1CCDC;

      border-radius: 10px;

      cursor: pointer;
    }

    /* Volume slider */
    #volume::-webkit-slider-thumb {
      appearance: none;
      -webkit-appearance: none;

      width: 11px;
      height: 11px;

      background: #D1CCDC;

      border: 2px solid #2E3641;
      border-radius: 50%;

      cursor: pointer;
    }

    #volume::-moz-range-thumb {
      width: 11px;
      height: 11px;

      background: #D1CCDC;

      border: 2px solid #2E3641;
      border-radius: 50%;

      cursor: pointer;
    }

    /* Hidden file input */
    #fileInput {
      display: none;
    }


    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 650px) {
      .music-box {
        width: 95%;
      }

      .music-library {
        width: 170px;
      }
    }

    @media (max-width: 480px) {
      .music-box {
        flex-direction: column;
      }

      .music-library {
        width: 100%;
      }

      .player {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <div class="music-box">

    <!-- =====================
         LEFT MUSIC LIBRARY
         ===================== -->

    <aside class="music-library">

      <h3 class="library-title">My Music</h3>

<div class="search-container">
  <input
    type="search"
    id="searchInput"
    placeholder="Search music..."
    autocomplete="off"
  >
</div>

<button class="add-button" id="addButton">
  + Add MP3
</button>
      <input
        type="file"
        id="fileInput"
        accept="audio/mpeg,.mp3"
        multiple
      >

      <div class="song-list" id="songList">
        <!-- Songs will appear here -->
      </div>

    </aside>


    <!-- =====================
         RIGHT PLAYER
         ===================== -->

    <main class="player">

      <button id="playButton" class="play-button">
        ▶
      </button>

 
<div class="music-info">

  <div class="song-title-row">

    <span id="songTitle">
      No song selected
    </span>

    <canvas id="spectrum"></canvas>

  </div>

  <small>
    Music Player
  </small>

  <div class="volume">

    <input
      id="volume"
      type="range"
      min="0"
      max="1"
      step="0.01"
      value="0.7"
    >

  </div>

  <div class="progress-container">

    <span id="currentTime">
      0:00
    </span>

    <input
      id="progress"
      type="range"
      min="0"
      max="100"
      value="0"
      step="0.1"
    >

    <span id="duration">
      0:00
    </span>

  </div>

</div>


    </main>

  </div>


  

  <!-- Audio element -->

  <audio id="audio"></audio>

<script>

  const spectrum = document.getElementById("spectrum");

const audioContext =
  new (window.AudioContext || window.webkitAudioContext)();

const analyser =
  audioContext.createAnalyser();

analyser.fftSize = 128;
analyser.smoothingTimeConstant = 0.75;

const source =
  audioContext.createMediaElementSource(audio);

source.connect(analyser);
analyser.connect(audioContext.destination);

const ctx = spectrum.getContext("2d");

const data =
  new Uint8Array(analyser.frequencyBinCount);


function drawSpectrum() {

  requestAnimationFrame(drawSpectrum);

  ctx.clearRect(
    0,
    0,
    spectrum.width,
    spectrum.height
  );

  if (audio.paused || audio.ended) {
    return;
  }

  analyser.getByteFrequencyData(data);

  const bars = 16;
  const gap = 3;

  const barWidth =
    (spectrum.width - gap * (bars - 1)) / bars;


  for (let i = 0; i < bars; i++) {

    const index =
      Math.floor(
        i * data.length / bars
      );

    const value = data[index];

    const barHeight =
      Math.max(
        2,
        (value / 255) * spectrum.height
      );

    const x =
      i * (barWidth + gap);

    const y =
      spectrum.height - barHeight;

    ctx.fillStyle = "#D1CCDC";

    ctx.fillRect(
      x,
      y,
      barWidth,
      barHeight
    );
  }
}

drawSpectrum();
  
  const button = document.getElementById("playButton");
  const audio = document.getElementById("audio");
  const volume = document.getElementById("volume");

  const addButton = document.getElementById("addButton");
  const fileInput = document.getElementById("fileInput");

  const songList = document.getElementById("songList");
  const songTitle = document.getElementById("songTitle");
  const searchInput = document.getElementById("searchInput");

  const progress = document.getElementById("progress");
  const currentTime = document.getElementById("currentTime");
  const duration = document.getElementById("duration");


  /* =========================
     VARIABLES
     ========================= */

  let songs = [];
  let currentSong = null;
  let currentObjectURL = null;

  const DB_NAME = "MyMusicDB";
  const STORE_NAME = "songs";


  /* =========================
     INDEXEDDB
     ========================= */

  function openDatabase() {
    return new Promise((resolve, reject) => {

      const request = indexedDB.open(DB_NAME, 1);

      request.onupgradeneeded = (event) => {

        const db = event.target.result;

        if (!db.objectStoreNames.contains(STORE_NAME)) {

          db.createObjectStore(STORE_NAME, {
            keyPath: "id",
            autoIncrement: true
          });

        }
      };

      request.onsuccess = () => {
        resolve(request.result);
      };

      request.onerror = () => {
        reject(request.error);
      };

    });
  }


  /* =========================
     SAVE SONG
     ========================= */

  async function saveSong(file) {

    const db = await openDatabase();

    return new Promise((resolve, reject) => {

      const transaction =
        db.transaction(STORE_NAME, "readwrite");

      const store =
        transaction.objectStore(STORE_NAME);

      store.add({
        name: file.name,
        file: file
      });

      transaction.oncomplete = () => {
        resolve();
      };

      transaction.onerror = () => {
        reject(transaction.error);
      };

    });
  }


  /* =========================
     LOAD SONGS
     ========================= */

  async function loadSongs() {

    const db = await openDatabase();

    return new Promise((resolve, reject) => {

      const transaction =
        db.transaction(STORE_NAME, "readonly");

      const store =
        transaction.objectStore(STORE_NAME);

      const request = store.getAll();

      request.onsuccess = () => {
        resolve(request.result);
      };

      request.onerror = () => {
        reject(request.error);
      };

    });
  }


  /* =========================
     PLAY / PAUSE
     ========================= */

  button.addEventListener("click", async () => {

    if (!currentSong) {
      return;
    }

    if (audio.paused) {

      try {

        await audio.play();

        button.textContent = "❚❚";

      } catch (error) {

        console.error(
          "Could not play audio:",
          error
        );

      }

    } else {

      audio.pause();

      button.textContent = "▶";

    }

  });


  /* =========================
     MUSIC ENDED
     ========================= */

  audio.addEventListener("ended", () => {

    button.textContent = "▶";

    progress.value = 0;

    currentTime.textContent = "0:00";

  });


  /* =========================
     VOLUME
     ========================= */

  volume.addEventListener("input", () => {

    audio.volume = Number(volume.value);

  });

  audio.volume = 0.7;


  /* =========================
     ADD MP3 BUTTON
     ========================= */

  addButton.addEventListener("click", () => {

    fileInput.click();

  });


  /* =========================
     FILE SELECTED
     ========================= */

  fileInput.addEventListener("change", async (event) => {

    const files = Array.from(event.target.files);

    for (const file of files) {

      if (
        file.type !== "audio/mpeg" &&
        !file.name.toLowerCase().endsWith(".mp3")
      ) {
        continue;
      }

      try {

        await saveSong(file);

      } catch (error) {

        console.error(
          "Could not save song:",
          error
        );

      }

    }

    /* Reload songs from IndexedDB */
    await initializeMusic();

    /* Allow selecting the same file again */
    fileInput.value = "";

  });


  /* =========================
     DISPLAY SONGS
     ========================= */

  function displaySongs() {

    songList.innerHTML = "";

    const searchTerm =
      searchInput.value.trim().toLowerCase();


    songs.forEach((song, index) => {

      if (
        searchTerm &&
        !song.name.toLowerCase().includes(searchTerm)
      ) {
        return;
      }


      const songElement =
        document.createElement("div");

      songElement.classList.add("song");


      if (
        currentSong &&
        song.id === currentSong.id
      ) {

        songElement.classList.add("active");

      }


      songElement.textContent = song.name;


      songElement.addEventListener("click", () => {

        selectSong(index);

      });


      songList.appendChild(songElement);

    });

  }


  /* =========================
     SEARCH
     ========================= */

  searchInput.addEventListener("input", () => {

    displaySongs();

  });


  /* =========================
     SELECT SONG
     ========================= */

  function selectSong(index) {

    const song = songs[index];

    if (!song) {
      return;
    }


    currentSong = song;


    /*
      Delete the previous temporary URL
      before creating a new one.
    */

    if (currentObjectURL) {

      URL.revokeObjectURL(currentObjectURL);

    }


    /*
      IMPORTANT:
      The MP3 is stored inside song.file
    */

    currentObjectURL =
      URL.createObjectURL(song.file);


    audio.src = currentObjectURL;


    songTitle.textContent = song.name;


    button.textContent = "▶";


    progress.value = 0;

    currentTime.textContent = "0:00";

    duration.textContent = "0:00";


    displaySongs();


    audio.play()
      if (audioContext.state === "suspended") {
  await audioContext.resume();
}
      .then(() => {

        button.textContent = "❚❚";

      })
      .catch((error) => {

        console.error(
          "Could not play audio:",
          error
        );

      });

  }


  /* =========================
     UPDATE PROGRESS BAR
     ========================= */

  audio.addEventListener("timeupdate", () => {

    if (!audio.duration) {
      return;
    }


    const percentage =
      (audio.currentTime / audio.duration) * 100;


    progress.value = percentage;


    currentTime.textContent =
      formatTime(audio.currentTime);

  });


  /* =========================
     LOAD SONG DURATION
     ========================= */

  audio.addEventListener("loadedmetadata", () => {

    duration.textContent =
      formatTime(audio.duration);

  });


  /* =========================
     SEEK THROUGH SONG
     ========================= */

  progress.addEventListener("input", () => {

    if (!audio.duration) {
      return;
    }


    const time =
      (progress.value / 100) *
      audio.duration;


    audio.currentTime = time;

  });


  /* =========================
     FORMAT TIME
     ========================= */

  function formatTime(seconds) {

    if (isNaN(seconds)) {
      return "0:00";
    }


    const minutes =
      Math.floor(seconds / 60);


    const remainingSeconds =
      Math.floor(seconds % 60);


    return (
      minutes +
      ":" +
      remainingSeconds
        .toString()
        .padStart(2, "0")
    );

  }


  /* =========================
     INITIALIZE MUSIC
     ========================= */

  async function initializeMusic() {

    try {

      songs = await loadSongs();

      displaySongs();

    } catch (error) {

      console.error(
        "Could not load songs:",
        error
      );

    }

  }


  /* =========================
     START
     ========================= */

  initializeMusic();

  const spectrum = document.getElementById("spectrum");
/* =========================
   AUDIO SPECTRUM ANALYZER
   ========================= */

const audioContext =
  new (window.AudioContext || window.webkitAudioContext)();

const analyser =
  audioContext.createAnalyser();

analyser.fftSize = 128;

analyser.smoothingTimeConstant = 0.75;

const source =
  audioContext.createMediaElementSource(audio);

source.connect(analyser);
analyser.connect(audioContext.destination);

const spectrumContext =
  spectrum.getContext("2d");

const frequencyData =
  new Uint8Array(analyser.frequencyBinCount);


function drawSpectrum() {

  requestAnimationFrame(drawSpectrum);

  const width = spectrum.width;
  const height = spectrum.height;

  spectrumContext.clearRect(
    0,
    0,
    width,
    height
  );


  /*
    Only animate while the song
    is actually playing.
  */

  if (audio.paused || audio.ended) {
    return;
  }


  analyser.getByteFrequencyData(
    frequencyData
  );


  const bars = 16;

  const gap = 3;

  const barWidth =
    (width - gap * (bars - 1)) / bars;


  for (let i = 0; i < bars; i++) {

    /*
      Use lower frequencies from
      the beginning of the spectrum.
    */

    const dataIndex =
      Math.floor(
        i * frequencyData.length / bars
      );


    const value =
      frequencyData[dataIndex];


    const barHeight =
      Math.max(
        2,
        (value / 255) * height
      );


    const x =
      i * (barWidth + gap);


    const y =
      height - barHeight;


    spectrumContext.fillStyle =
      "#D1CCDC";


    spectrumContext.fillRect(
      x,
      y,
      barWidth,
      barHeight
    );

  }

}


drawSpectrum();



</script>



</body>
</html>
