   
<!-- =====================
     LEFT MUSIC LIBRARY
     ===================== -->

<aside class="music-library">

  <h3 class="library-title">My Music</h3>
   

   
  <div class="song-list" id="songList">
    <!-- Songs will appear here -->
  </div>

</aside>


<!-- =====================
     RIGHT PLAYER
     ===================== -->

<main class="player">

  <button id="playButton" class="play-button">
    ▶
  </button>
   

   
<span id="songTitle">
  No song selected
</span>

<canvas id="spectrum"></canvas>
   

   
<input
  id="volume"
  type="range"
  min="0"
  max="1"
  step="0.01"
  value="0.7"
>
   

   
<span id="currentTime">
  0:00
</span>

<input
  id="progress"
  type="range"
  min="0"
  max="100"
  value="0"
  step="0.1"
>

<span id="duration">
  0:00
</span>
   

   
</main>
