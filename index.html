<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music Player</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;

      background: #D1CCDC;
      font-family: Arial, sans-serif;
    }

    /* Main music box */
    .music-box {
      width: 280px;
      padding: 16px;

      display: flex;
      align-items: center;
      gap: 14px;

      background: #2E3641;

      border-radius: 14px;

      box-shadow: 0 8px 20px rgba(46, 54, 65, 0.25);
    }

    /* Play button */
    .play-button {
      flex-shrink: 0;

      width: 48px;
      height: 48px;

      border: none;
      border-radius: 50%;

      background: #D1CCDC;
      color: #2E3641;

      font-size: 18px;

      cursor: pointer;

      display: flex;
      align-items: center;
      justify-content: center;

      transition: transform 0.2s ease;
    }

    .play-button:hover {
      transform: scale(1.08);
    }

    /* Music information */
    .music-info {
      flex: 1;

      min-width: 0;

      display: flex;
      flex-direction: column;
      gap: 4px;

      color: #D1CCDC;
    }

    .music-info span {
      font-size: 15px;
      font-weight: 600;
    }

    .music-info small {
      font-size: 11px;
      opacity: 0.7;
    }

    /* Volume */
    .volume {
      width: 100%;

      display: flex;
      align-items: center;
      gap: 7px;

      margin-top: 5px;
    }

    .volume span {
      font-size: smaller;
    }

    #volume {
      flex: 1;

      height: 4px;

      appearance: none;
      -webkit-appearance: none;

      background: #D1CCDC;

      border-radius: 10px;

      cursor: pointer;
    }

    /* Volume slider button */
    #volume::-webkit-slider-thumb {
      appearance: none;
      -webkit-appearance: none;

      width: 11px;
      height: 11px;

      background: #D1CCDC;

      border: 2px solid #2E3641;
      border-radius: 50%;

      cursor: pointer;
    }

    #volume::-moz-range-thumb {
      width: 11px;
      height: 11px;

      background: #D1CCDC;

      border: 2px solid #2E3641;
      border-radius: 50%;

      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="music-box">

    <button id="playButton" class="play-button">▶</button>

    <div class="music-info">
      <span>My Song</span>
      <small>Music Player</small>

      <div class="volume">
        <input
          id="volume"
          type="range"
          min="0"
          max="1"
          step="0.01"
          value="0.7"
        >
      </div>
    </div>

  </div>

  <audio id="audio" src="music.mp3"></audio>

  <script>
    const button = document.getElementById("playButton");
    const audio = document.getElementById("audio");
    const volume = document.getElementById("volume");

    // Play / Pause button
    button.addEventListener("click", async () => {
      if (audio.paused) {
        try {
          await audio.play();
          button.textContent = "❚❚";
        } catch (error) {
          console.error("Could not play audio:", error);
        }
      } else {
        audio.pause();
        button.textContent = "▶";
      }
    });

    // Reset button when music ends
    audio.addEventListener("ended", () => {
      button.textContent = "▶";
    });

    // Volume control
    volume.addEventListener("input", () => {
      audio.volume = volume.value;
    });

    // Initial volume
    audio.volume = 0.7;
  </script>

</body>
</html>
